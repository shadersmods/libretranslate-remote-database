name: Add or update an instance
description: Suggest a public LibreTranslate instance or correct its catalog entry.
title: "[Instance] "
body:
  - type: input
    id: url
    attributes:
      label: API base URL
      description: Use the API base URL, including any deployment prefix or port. Prefer HTTPS and mention HTTP-only endpoints in the details. Do not include credentials.
      placeholder: https://translate.example.org
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Public source
      description: Link to an operator page, service documentation, or public mirror listing.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Requested change
      description: Name the service and explain what should be added or corrected. Include any known usage terms or restrictions.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked the catalog and existing issues for this URL.
          required: true
        - label: This report contains no API keys, personal information, or private network addresses.
          required: true
